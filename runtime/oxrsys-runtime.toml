# OXRSys Runtime Configuration
# Preferred location:
#   macOS: ~/Library/Application Support/OXRSys/oxrsys-runtime.toml
# Fallback location: next to liboxrsys-runtime.dylib

[general]
# Enable or disable this runtime without unregistering the manifest.
# When false, xrCreateInstance returns XR_ERROR_RUNTIME_UNAVAILABLE.
runtime_enabled = true

[streaming]
# H.265 encoding bitrate in Mbps. Lower = less latency but more artifacts.
# Try 20-30 for lower latency, 50+ for quality.
bitrate_mbps = 50

# Preferred headset display refresh rate. Supported values: 60, 72, 80, 90, 120.
refresh_rate_hz = 72

# Resolution multiplier (0.25 to 1.0). Lower = faster encode, less bandwidth, more blur.
# 0.5 = half resolution (recommended for WiFi), 1.0 = native resolution.
resolution_scale = 0.75

# Target headset for the per-eye render resolution: "quest2", "quest3", or "avp".
# Sets the resolution the runtime renders at (quest2=1440x1584, quest3=1512x1680,
# avp=3024x3360 per eye). Pick the headset you are streaming to; use resolution_scale
# above to trim how much of it is encoded and streamed.
render_device = "quest3"

# Lowest encode scale that ABR "full" may request when a reliable USB TCP
# headset client supports live stream reconfiguration. The OpenXR app's own
# swapchain/render resolution is unchanged.
dynamic_resolution_min_scale = 0.50

# Keyframe interval in seconds (1-10). Higher = less bandwidth spikes, slower recovery.
# Default 2 is a good balance. Use 1 for lossy WiFi, 5+ for USB.
keyframe_interval_sec = 2

# Video codec: "h265", "h264", or "auto".
# H.265 remains the default for headset compatibility; H.264 is useful for
# clients that advertise H.264 support. VideoToolbox provides both codecs.
video_codec = "h265"

# Encoder speed preset: "quality", "balanced", "speed"
# speed  = lowest latency, fastest encode, lower quality
# balanced = default, good mix
# quality  = best visual quality, slightly higher latency
encoder_preset = "balanced"

# Encode HEVC Main10 for H.265 clients that advertise 10-bit decode support.
# H.264 and clients without the capability continue to receive 8-bit video.
encoder_10bit = false

# Out-of-process native-arm64 HARDWARE video encoder helper.
# When the runtime dylib is loaded in-process by an x86_64/Rosetta host (for
# example CrossOver's Wine host), VideoToolbox refuses it the hardware HEVC
# encoder and silently falls back to the software encoder (~20-34ms/frame here,
# 27-40ms on real content). A small native-arm64 helper process IS granted the
# hardware encoder (~8ms/frame), and the runtime shares its compose IOSurfaces
# with it zero-copy via mach send rights.
#   "auto"  (default) use the helper only when THIS process cannot get a
#           hardware encoder for the negotiated codec, asked of VideoToolbox
#           rather than guessed from the architecture. A runtime running
#           natively on arm64 already has one, so it keeps encoding in-process;
#           so does a Rosetta host negotiating H.264, which Rosetta is granted.
#   "true"  always use the helper (debugging)
#   "false" never use the helper (debugging)
# The helper covers H.265 Main, H.265 Main10 and H.264 Main, always encoding the
# codec and profile that were negotiated. If it cannot start or does not get the
# hardware encoder, the runtime logs where it broke and transparently keeps using
# the in-process encoder.
encoder_helper = "auto"
# Path to the helper binary. Empty = look for "oxrsys-encoder-helper" next to the
# runtime dylib (also overridable at runtime via $OXRSYS_ENCODER_HELPER_PATH).
encoder_helper_path = ""

# Streaming transport: "auto" tries USB ADB reverse and WiFi, "wifi" disables USB TCP
# listeners, and "usb_adb" disables WiFi discovery fallback.
transport = "auto"

# Server-side foveated video encoding preset: "off", "light", "medium", or "high".
# This compresses frame edges before video encoding and asks compatible clients
# to re-expand the image after decode.
foveated_encoding_preset = "off"

# Headset client foveation override: "auto", "off", "light", "medium", or "high".
# "auto" leaves the headset client unmanaged by Home/runtime config.
client_foveation_preset = "auto"

# Enable Quest shader upscaling after video decode.
client_upscaling = false

# Headset contrast-adaptive sharpening strength (0.0-1.0). 0 = off. A little (0.3-0.5)
# counteracts encode/upscale softness on the headset. Applied by the client after decode.
client_sharpening = 0.0

# Quest client reprojection for short decode/network gaps: "off", "pose", or "pose_warp".
client_reprojection = "pose"

# Adaptive bitrate mode: "off", "bitrate", or "full".
# "full" may select live streaming resolution profiles on reliable USB TCP.
abr_mode = "bitrate"

# Enable headset passthrough as a runtime feature.
passthrough_enabled = false

# Advanced MR opt-in: expose OpenXR alpha-blend environment modes to apps.
# Keep false for normal VR apps so dark reflective content stays opaque.
app_alpha_blend_passthrough = false

# Occlusion mode: "off", "scene_mesh", or "environment_depth".
# Occlusion is enabled only when a compatible depth or scene source is available.
occlusion_mode = "off"

# Reserved for headset speaker audio. The runtime does not advertise audio until
# a platform capture/playback path is attached.
headset_audio = false

[spatial]
# Spatial features are off by default until a headset client reports support.
enabled = false
anchors = false
scene = false
persistence = false

[logging]
# Write server logs to the platform state directory.
#   macOS: ~/Library/Application Support/OXRSys/oxrsys-runtime.log
file_logging = true

# Capture Quest/headset logcat to the platform state directory.
# Requires adb in PATH and a connected device.
quest_logcat = false
